<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        font-family: "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
          "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      #main {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        background-color: #222;
        color: aliceblue;
      }
      input {
        display: none;
      }
      #btn {
        padding: 12px 22px;
        background-color: rgb(86, 152, 160);
        color: white;
        border-radius: 5px;
        font-weight: 600;
      }
      #btn:hover {
        background-color: rgba(86, 152, 160, 0.674);
      }
    </style>
  </head>
  <body>
    <div id="main">
      <input id="realIn" type="file" />
      <div id="btn">Upload File</div>
    </div>
    <script src="script3.js"></script>
  </body>
</html>
