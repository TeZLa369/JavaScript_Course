<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled Form</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
      }

      body {
        width: 100%;
        height: 100vh;
        background-color: #0d0d0d;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
      }

      .main {
        width: 100%;
        max-width: 400px;
        padding: 40px;
        background-color: #1a1a1a;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(1, 39, 83, 0.203);
      }

      .main:hover {
        transform: scale3d(1.1, 1.1, 1.1);
        border: 13px;
        border-color: #00bcd4;
        transition: transform 0.3s; 
      }

      .main:not(:hover) {
        transform: scale3d(1, 1, 1);
        transition: transform 0.3s;
      }

      .rotateCard {
        transform: rotate3d(0, 1, 0, 180deg);
        transition: all 0.5s;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      input {
        padding: 12px 16px;
        background-color: #222;
        border: 1px solid #444;
        border-radius: 8px;
        color: #eee;
        font-size: 16px;
        transition: all 0.3s;
      }

      input::placeholder {
        color: #888;
      }

      input:focus {
        outline: none;
        border-color: #00bcd4;
        box-shadow: 0 0 8px rgba(100, 100, 255, 0.5);
        transform: translateY(-2px);
      }

      button {
        padding: 12px 16px;
        background-color: #01a3b8;
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #018796;
      }
      .card {
        padding: 20px;
        width: 100%;
        height: 100%;
        display: inline-block;
        border-radius: 12px;
        border: 1px solid #555;
        display: inline-block;
      }
      .profilePicture img {
        border-radius: 50%;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .profilePicture {
        width: 50px;
        height: 50px;
        background-color: red;
        border-radius: 50%;
        margin-bottom: 10px;
      }
      .card h5 {
        margin-top: 5px;
      }
      .card p {
        font-size: 12px;
        margin-top: 12px;
        font-style: italic;
      }
      .btnForm {
        margin-top: 12px;
        padding: 12px 16px;
        background-color: #d54343;
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        display: block;
        margin-left: auto;
        margin-right: auto;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .btnForm:hover {
        background-color: #9a3030;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <form action="">
        <input type="text" placeholder="Name" />
        <input type="text" placeholder="Occupation" />
        <input type="url" placeholder="Profile Pic URL" />
        <input type="text" placeholder="Info" />
        <button type="submit">Submit</button>
      </form>
