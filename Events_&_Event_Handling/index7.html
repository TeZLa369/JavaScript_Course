<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        color: red;
        font-size: 20px;
        width: 100%;
        height: 100%;
        background-color: #222;
      }
      .a {
        color: aliceblue;
        width: 200px;
        height: 200px;
        padding: 100px;
        background-color: rgb(139, 50, 58);
      }
      .b {
        width: 100px;
        height: 100px;
        padding: 100px;
        background-color: rgb(63, 212, 183);
      }
      .c {
        width: 100px;
        height: 100px;
        padding: 100px;
        background-color: rgb(245, 183, 177);
      }
      button {
        margin-top: 10px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        border: none;
        width: 100px;
        color: aliceblue;
        padding: 10px;
        background-color: red;
      }
      button:hover {
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
        transition: all 0.5s;
      }
      button:not(:hover) {
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        transition: all 0.5s;
      }
      .main div:hover {
        padding: 150px;
        transition: all 0.5s;
      }
      .main div:not(:hover) {
        padding: 100px;
        transition: all 0.5s;
      }
      input {
        border-radius: 12px;
        margin-top: 12px;
        border: none;
        padding: 12px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
      }
      marquee {
        font-family: Georgia, "Times New Roman", Times, serif;
        color: aliceblue;
        font-size: 25px;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <marquee direction="right">WHAT A DESIGN!</marquee>
      <marquee>Characters left: <span>20</span></marquee>
      <div class="a">
        a
        <div class="b">
          b
          <div class="c">
            c
            <button id="clckBtn" type="button">Button</button>
            <input placeholder="text goes here..." type="text" />
           
          </div>
        </div>
      </div>
    </div>
    <script src="script7.js"></script>
  </body>
</html>
