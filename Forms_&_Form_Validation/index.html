<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <style>
      body {
        width: 100%;
        height: 100%;
        background-color: #222;
      }
      form {
        margin: auto;
        gap: 5px;
        max-width: 300px;
        display: flex;
        flex-direction: column;
      }

      input,
      select,
      textarea {
        padding: 0.5rem;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        max-width: 100%;
      }
      #submit {
        color: aliceblue;
        background-color: red;
      }

      #submit:hover {
        background-color: rgb(188, 1, 1);
        transition: all 0.5s;
      }
      #submit:not(:hover) {
        background-color: red;
        transition: all 0.5s;
      }
      small,
      #passSmall,
      #emailSmall {
        display: none;
        color: rgb(255, 89, 89);
        font-size: 12px;
        display: none;
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <form>
      <input id="name" type="text" placeholder="name" />
      <small hidden>Your name should be atleast 2 characters</small>
      <input id="email" type="email" placeholder="email" />
      <small hidden id="emailSmall"
        >Enter a valid email</small
      >
      <input id="password" type="password" placeholder="password" />
      <small hidden id="passSmall">Please follow the password rules</small>
      <select>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="others">Others</option>
      </select>
      <textarea placeholder="Tell us about yourself..."></textarea>
      <input type="submit" id="submit" />
    </form>
    <script src="script.js"></script>
  </body>
</html>
