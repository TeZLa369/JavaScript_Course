<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <!-- Determinate download progress -->
    <div
      class="progress"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="45"
      aria-label="Download progress"
    >
      <div class="downloading"><h3>Downloading</h3></div>
      <div class="progress__track">
        <div class="progress__fill" style="width: 0%"></div>
      </div>
      <div class="progress__label">0%</div>
    </div>
    <script src="scripts2.js"></script>
  </body>
</html>
