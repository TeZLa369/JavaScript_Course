<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Session Storage & Cookies</title>
    <style>
      body {
        background-color: black;
        color: aliceblue;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .home {
        position: relative;
        padding: 12px;
        display: inline-block;
        width: 50px;
        background-color: #222;
      }

      .home::after {
        content: "";
        position: absolute;
        left:0;
        bottom: 0;
        width: 0;
        height: 2px;
        background-color: rgb(255, 255, 255);
    }
    .home:hover::after {
          transition: width 0.5s ease;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="home">HOME</div>
    <script src="script.js"></script>
  </body>
</html>
